<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app" data-screen="todos">
    <header class="top" data-testid="todos.top">
      <span class="brand">Todo</span>
      <span class="spacer" data-testid="todos.topPush"></span>
      <kbd data-testid="todos.topHint">Enter to add</kbd>
      <span class="avatar" data-testid="todos.me">Ada Lovelace</span>
    </header>

    <div class="grid" data-testid="todos.grid">
      <div class="row" data-testid="todos.topRow">
        <section class="card" data-testid="todos.addCard" aria-labelledby="add-heading">
          <h2 id="add-heading">Add a task</h2>
          <form id="add-form" class="add-form" novalidate>
            <input id="new-title" data-testid="todos.newTitle" type="text" maxlength="200"
                   placeholder="What needs doing?" aria-label="New todo" autocomplete="off" />
            <div class="add-row" data-testid="todos.addRow">
              <span class="spacer" data-testid="todos.addPush"></span>
              <span class="spin" data-testid="todos.addSpin" role="status" aria-label="Adding" hidden></span>
              <button type="submit" id="add-btn" data-testid="todos.addBtn" class="primary" disabled>Add</button>
            </div>
          </form>
          <p class="field-error" id="add-error" data-testid="todos.addErr" role="alert" hidden>Could not add the todo. Try again.</p>
        </section>

        <section class="card" data-testid="todos.overviewCard" aria-labelledby="overview-heading">
          <h2 id="overview-heading">Overview</h2>
          <div class="stat" data-testid="todos.statTotal">
            <span class="stat-label">Tasks</span>
            <span class="stat-value" id="stat-value">0</span>
            <span class="stat-hint">all todos</span>
          </div>
          <p class="field-error" id="toggle-error" data-testid="todos.toggleErrNote" role="alert" hidden>Could not update the todo. Try again.</p>
          <p class="field-error" id="del-error" data-testid="todos.delErrNote" role="alert" hidden>Could not delete the todo. Try again.</p>
        </section>
      </div>

      <div class="row" data-testid="todos.bottomRow">
        <section class="card" data-testid="todos.activeCard" aria-labelledby="active-heading">
          <h2 id="active-heading">Active</h2>
          <div id="active-state"></div>
          <ul class="todo-list" id="todo-list" data-testid="todos.todoList"></ul>
        </section>

        <section class="card" data-testid="todos.doneCard" aria-labelledby="done-heading">
          <div class="card-head">
            <h2 id="done-heading">Done</h2>
            <button type="button" id="clear-done-btn" data-testid="todos.clearDoneBtn" aria-label="Clear done todos" hidden>Clear done</button>
          </div>
          <div id="done-state"></div>
          <ul class="todo-list" id="done-list" data-testid="todos.doneList"></ul>
          <p class="field-error" id="clear-error" data-testid="todos.clearErrNote" role="alert" hidden>Could not clear done todos. Try again.</p>
        </section>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="/app.js"></script>
</body>
</html>
